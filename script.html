<script>
// ═══════════════════════════════════════════════════════════════
// 济阳蔡氏公会 — Frontend App Logic
// ═══════════════════════════════════════════════════════════════

// ── State ────────────────────────────────────────────────────
var STATE = {
  currentUser: null,
  users: [], youth: [], events: [], attend: [],
  selectedRole: 'admin',
};

// ── Helpers ──────────────────────────────────────────────────
function today() {
  return new Date().toISOString().split('T')[0];
}
function daysBetween(d1, d2) {
  if (!d1 || !d2) return 999;
  return Math.floor((new Date(d2) - new Date(d1)) / 86400000);
}
function getTier(lastActive) {
  if (!lastActive) return 3;
  var days = daysBetween(String(lastActive), today());
  if (days <= 30) return 1;
  if (days <= 60) return 2;
  return 3;
}
function tierPts(t) { return t === 1 ? 3 : t === 2 ? 2 : 0; }
function tierLabel(t) { return t === 1 ? 'Tier 1 · Active' : t === 2 ? 'Tier 2 · Fading' : 'Tier 3 · Inactive'; }
function tierColor(t) { return t === 1 ? '#2e7d32' : t === 2 ? '#b8960c' : '#aaa'; }
function fmtDate(d) {
  if (!d) return '—';
  var dt = new Date(d);
  return dt.toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric' });
}
function weeksUntil(dateStr) {
  return Math.floor(daysBetween(today(), dateStr) / 7);
}

function calcScore(dirId) {
  var myYouth = STATE.youth.filter(function(y) { return String(y.directorId) === String(dirId) && y.status === 'approved'; });
  var onboarded = myYouth.length;
  var engagePts = myYouth.reduce(function(s, y) { return s + tierPts(getTier(y.lastActive)); }, 0);
  var approvedEvts = STATE.events.filter(function(e) { return String(e.directorId) === String(dirId) && e.status === 'approved'; }).length;
  var eventPts = approvedEvts * 10;
  return { onboarded: onboarded, onboardedPts: onboarded, engagePts: engagePts, approvedEvts: approvedEvts, eventPts: eventPts, total: onboarded + engagePts + eventPts };
}

function statusColor(s) { return s === 'approved' ? '#2e7d32' : s === 'pending' ? '#b8960c' : '#c0292b'; }
function typeColor(t) {
  var m = { Cultural:'#1a3a6b', Social:'#2e7d32', Education:'#7b1fa2', Sports:'#e65100', 'Community Service':'#b8960c', Other:'#555' };
  return m[t] || '#555';
}

function badge(label, color) {
  return '<span class="badge" style="background:' + color + '18;color:' + color + '">' + label + '</span>';
}

function scoreBar(label, pts, max, color, detail) {
  var pct = max > 0 ? Math.min(100, (pts / max) * 100) : 0;
  return '<div class="score-bar-wrap">' +
    '<div class="score-bar-labels"><span class="score-bar-left">' + label + '</span><span class="score-bar-right" style="color:' + color + '">' + detail + '</span></div>' +
    '<div class="score-bar-track"><div class="score-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
    '</div>';
}

// ── Loading ──────────────────────────────────────────────────
function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

// ── Pages ────────────────────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

// ── Role selector on login ───────────────────────────────────
function setRole(role) {
  STATE.selectedRole = role;
  document.querySelectorAll('.role-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('[data-role="' + role + '"]').classList.add('active');
}

// ── LOGIN ────────────────────────────────────────────────────
function doLogin() {
  var username = document.getElementById('loginUser').value.trim();
  var password = document.getElementById('loginPass').value.trim();
  if (!password) return;
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) {
        document.getElementById('loginError').textContent = res.error || 'Invalid credentials.';
        document.getElementById('loginError').style.display = 'block';
        return;
      }
      STATE.currentUser = res.user;
      loadAllData();
    })
    .withFailureHandler(function(err) {
      hideLoading();
      document.getElementById('loginError').textContent = 'Login failed: ' + err.message;
      document.getElementById('loginError').style.display = 'block';
    })
    .login(username, password);
}

function loadAllData() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) { alert('Failed to load data: ' + res.error); return; }
      STATE.users  = res.users  || [];
      STATE.youth  = res.youth  || [];
      STATE.events = res.events || [];
      STATE.attend = res.attend || [];
      routeByRole();
    })
    .withFailureHandler(function(err) {
      hideLoading();
      alert('Data load failed: ' + err.message);
    })
    .loadAll();
}

function routeByRole() {
  var role = STATE.currentUser.role;
  if (role === 'admin')    { renderAdmin();    showPage('adminPage'); }
  if (role === 'director') { renderDirector(); showPage('directorPage'); }
  if (role === 'youth')    { renderYouth();    showPage('youthPage'); }
}

function doLogout() {
  STATE.currentUser = null;
  STATE.users = []; STATE.youth = []; STATE.events = []; STATE.attend = [];
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').style.display = 'none';
  showPage('loginPage');
}

// ── Tab switching ────────────────────────────────────────────
function adminTab(btn, viewId) {
  document.querySelectorAll('#adminPage .tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('#adminPage .view').forEach(function(v) { v.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById(viewId).classList.add('active');
}
function dirTab(btn, viewId) {
  document.querySelectorAll('#directorPage .tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('#directorPage .view').forEach(function(v) { v.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById(viewId).classList.add('active');
}
function youthTab(btn, viewId) {
  document.querySelectorAll('#youthPage .tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('#youthPage .view').forEach(function(v) { v.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById(viewId).classList.add('active');
}

// ── Modals ───────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeModalOutside(e, id) { if (e.target.id === id) closeModal(id); }

// ══════════════════════════════════════════════════════════════
// ADMIN RENDER
// ══════════════════════════════════════════════════════════════
function renderAdmin() {
  document.getElementById('adminName').textContent = STATE.currentUser.name;

  var allYouth     = STATE.youth.filter(function(y) { return y.status === 'approved'; });
  var approvedEvts = STATE.events.filter(function(e) { return e.status === 'approved'; });
  var pendingYouth = STATE.youth.filter(function(y) { return y.status === 'pending'; });
  var pendingEvts  = STATE.events.filter(function(e) { return e.status === 'pending'; });
  var totalPending = pendingYouth.length + pendingEvts.length;

  document.getElementById('statApprovedYouth').textContent  = allYouth.length;
  document.getElementById('statApprovedEvents').textContent = approvedEvts.length;
  document.getElementById('statPending').textContent        = totalPending;

  if (totalPending > 0) {
    var pb = document.getElementById('adminPendingBadge');
    pb.style.display = 'block';
    pb.textContent   = totalPending + ' pending';
  }
  var ac = document.getElementById('approvalCount');
  if (ac) ac.textContent = totalPending > 0 ? ' (' + totalPending + ')' : '';

  renderAdminLeaderboard();
  renderAdminApprovals();
  renderAdminEvents();
  renderAdminMembers();
}

function renderAdminLeaderboard() {
  var directors = STATE.users.filter(function(u) { return u.role === 'director'; });
  var sorted = directors.slice().sort(function(a, b) { return calcScore(b.id).total - calcScore(a.id).total; });

  var html = '<div class="score-key">' +
    '<div class="score-key-title">Scoring Formula</div>' +
    [
      { dot:'#1a3a6b', text:'Onboarding: +1 pt per approved youth' },
      { dot:'#2e7d32', text:'Engagement Tier 1 (≤30d active): +3 pts/month' },
      { dot:'#b8960c', text:'Engagement Tier 2 (31–60d): +2 pts/month' },
      { dot:'#aaa',    text:'Engagement Tier 3 (>60d): +0 pts/month' },
      { dot:'#c0292b', text:'Youth-led event approved: +10 pts each' },
    ].map(function(k) {
      return '<div class="score-key-row"><div class="score-key-dot" style="background:' + k.dot + '"></div><div class="score-key-text">' + k.text + '</div></div>';
    }).join('') + '</div>';

  var medals = ['🥇','🥈','🥉'];
  sorted.forEach(function(dir, idx) {
    var s = calcScore(dir.id);
    var myYouth = STATE.youth.filter(function(y) { return String(y.directorId) === String(dir.id) && y.status === 'approved'; });
    var pending = STATE.youth.filter(function(y) { return String(y.directorId) === String(dir.id) && y.status === 'pending'; }).length;
    var color   = dir.color || '#1a3a6b';
    var rankHtml = idx < 3 ? medals[idx] : '<span class="rank-num">' + (idx+1) + '</span>';

    var chipsHtml = myYouth.map(function(y) {
      var t = getTier(y.lastActive);
      return '<span class="chip" style="background:' + tierColor(t) + '14;border-color:' + tierColor(t) + '30;color:' + tierColor(t) + '">' + y.name + ' · T' + t + '</span>';
    }).join('');
    if (pending > 0) chipsHtml += '<span class="chip" style="background:#fff8e1;border-color:#b8960c;color:#7a6200">+' + pending + ' pending</span>';

    html += '<div class="card' + (idx===0?' card-top':'') + '" style="border-left:' + (idx===0?'4px solid '+color:'1px solid #dde4f0') + '">' +
      '<div class="card-row">' +
        '<span class="medal">' + rankHtml + '</span>' +
        '<div class="card-avatar" style="background:linear-gradient(135deg,'+color+','+color+'bb);box-shadow:0 2px 8px '+color+'44">' + (dir.avatar||'??') + '</div>' +
        '<div style="flex:1"><div class="card-name">' + dir.name + '</div><div class="card-sub">' + (dir.zh||'') + '</div></div>' +
        '<div style="text-align:right"><div class="card-pts" style="color:'+color+'">' + s.total + '</div><div class="card-pts-lbl">pts</div></div>' +
      '</div>' +
      scoreBar('Onboarding', s.onboardedPts, 15, '#1a3a6b', s.onboarded + ' youth × 1 pt = ' + s.onboardedPts + ' pts') +
      scoreBar('Engagement',  s.engagePts,    30, '#2e7d32', s.engagePts + ' pts/month') +
      scoreBar('Youth Events', s.eventPts,    50, '#c0292b', s.approvedEvts + ' event' + (s.approvedEvts!==1?'s':'') + ' × 10 = ' + s.eventPts + ' pts') +
      '<div class="chips">' + chipsHtml + '</div>' +
      '</div>';
  });

  document.getElementById('adminLeaderboard').innerHTML = html;
}

function renderAdminApprovals() {
  var pendingYouth = STATE.youth.filter(function(y) { return y.status === 'pending'; });
  var pendingEvts  = STATE.events.filter(function(e) { return e.status === 'pending'; });

  var html = '';

  // Youth
  html += '<div style="margin-bottom:28px">';
  html += sectionHead('Youth Onboarding Requests', pendingYouth.length, '#1a3a6b');
  if (pendingYouth.length === 0) {
    html += '<div class="empty">No pending youth requests ✓</div>';
  } else {
    pendingYouth.forEach(function(y) {
      var dir = STATE.users.find(function(u) { return String(u.id) === String(y.directorId); });
      html += '<div class="approval-row">' +
        '<div style="flex:1"><div class="approval-name">' + y.name + '</div>' +
        '<div class="approval-sub">@' + y.instagram + ' · +' + y.whatsapp + ' · via <strong>' + (dir?dir.name:'?') + '</strong></div></div>' +
        '<button class="btn-review" style="background:#1a3a6b" onclick="openYouthReview(\'' + y.id + '\')">Review →</button>' +
        '</div>';
    });
  }
  html += '</div>';

  // Events
  html += sectionHead('Event Approval Requests', pendingEvts.length, '#c0292b');
  if (pendingEvts.length === 0) {
    html += '<div class="empty">No pending events ✓</div>';
  } else {
    pendingEvts.forEach(function(ev) {
      var dir = STATE.users.find(function(u) { return String(u.id) === String(ev.directorId); });
      var wks = weeksUntil(ev.date);
      html += '<div class="approval-row red-left">' +
        '<div style="flex:1">' +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">' +
            '<span class="approval-name">' + ev.name + '</span>' +
            badge(ev.type, typeColor(ev.type)) +
            (wks < 12 ? badge('⚠ <12 weeks', '#c0292b') : '') +
          '</div>' +
          '<div class="approval-meta"><span>📅 ' + fmtDate(ev.date) + '</span><span>👥 ~' + ev.estPax + ' pax</span><span>📍 ' + (ev.venue||'TBC') + '</span><span>🎓 ' + (dir?dir.name:'?') + '</span></div>' +
        '</div>' +
        '<button class="btn-review" style="background:#c0292b" onclick="openEventReview(\'' + ev.id + '\')">Review →</button>' +
        '</div>';
    });
  }

  // History
  var done = STATE.youth.filter(function(y){return y.status!=='pending';}).concat(
    STATE.events.filter(function(e){return e.status!=='pending';})
  );
  if (done.length > 0) {
    html += '<div style="margin-top:28px">' + sectionHead('Decision History', null, 'rgba(26,58,107,0.45)');
    done.forEach(function(item) {
      var isYouth = item.instagram !== undefined;
      var detail  = isYouth ? '@'+item.instagram : (item.type + ' · ' + fmtDate(item.date));
      html += '<div class="history-row"><div style="flex:1"><div class="history-name">' + item.name + '</div><div class="history-sub">' + detail + '</div></div>' +
        badge(item.status==='approved'?'✓ Approved':'✕ Rejected', statusColor(item.status)) + '</div>';
    });
    html += '</div>';
  }

  document.getElementById('adminApprovals').innerHTML = html;
}

function renderAdminEvents() {
  var sorted = STATE.events.slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  var html   = sectionHead('All Events', STATE.events.length, '#c0292b');

  sorted.forEach(function(ev) {
    var dir = STATE.users.find(function(u){ return String(u.id)===String(ev.directorId); });
    var sc  = statusColor(ev.status);
    var attendees = Array.isArray(ev.attendees) ? ev.attendees : [];
    html += '<div class="event-card" style="border-top:3px solid '+sc+';opacity:'+(ev.status==='rejected'?0.6:1)+'">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px">' +
        '<div class="event-title">' + ev.name + '</div>' +
        badge(ev.status, sc) +
      '</div>' +
      '<div class="event-grid">' +
        eventCell('Type', badge(ev.type, typeColor(ev.type))) +
        eventCell('Date', fmtDate(ev.date)) +
        eventCell('Est. Pax', ev.estPax + ' pax') +
        eventCell('Venue', ev.venue||'TBC') +
        eventCell('Youth Organiser', ev.youthOrganiser||'—') +
        eventCell('Director', dir?dir.name:'—') +
        eventCell('Checked In', attendees.length + ' / ' + ev.estPax) +
        eventCell('Submitted', fmtDate(ev.submittedDate)) +
      '</div>' +
      (ev.description ? '<div class="event-desc">' + ev.description + '</div>' : '') +
      (ev.status==='approved' ? '<button class="btn-review" style="background:#1a3a6b" onclick="openQR(\'' + ev.id + '\')">📷 Scan Attendance</button>' : '') +
      (ev.status==='pending'  ? '<button class="btn-review" style="background:#c0292b;margin-top:10px" onclick="openEventReview(\'' + ev.id + '\')">Admin Review →</button>' : '') +
      '</div>';
  });

  document.getElementById('adminEvents').innerHTML = html;
}

function renderAdminMembers() {
  var approved = STATE.youth.filter(function(y){ return y.status==='approved'; });
  var html = sectionHead('All Youth Members', approved.length, '#1a3a6b');

  approved.forEach(function(y) {
    var t   = getTier(y.lastActive);
    var dir = STATE.users.find(function(u){ return String(u.id)===String(y.directorId); });
    html += '<div class="member-row">' +
      '<div class="tier-circle" style="background:'+tierColor(t)+'20;border-color:'+tierColor(t)+';color:'+tierColor(t)+'">T'+t+'</div>' +
      '<div style="flex:1">' +
        '<div class="approval-name">' + y.name + ' <span style="font-weight:400;opacity:0.5;font-size:12px">' + (y.zh||'') + '</span></div>' +
        '<div class="approval-sub">' + (dir?dir.name:'?') + ' · Last active: ' + fmtDate(y.lastActive) + ' · ' + tierLabel(t) + '</div>' +
      '</div>' +
      badge('+' + tierPts(t) + ' pts/mo', tierColor(t)) +
      '</div>';
  });

  document.getElementById('adminMembers').innerHTML = html;
}

// ── Youth Review Modal ───────────────────────────────────────
function openYouthReview(youthId) {
  var y   = STATE.youth.find(function(u){ return String(u.id)===String(youthId); });
  var dir = STATE.users.find(function(u){ return String(u.id)===String(y.directorId); });
  var html = '<div class="modal-title">Review Youth Onboarding</div>' +
    '<div class="modal-sub">Open profiles → add to both groups → then approve.</div>' +
    '<div style="background:#fdf8f0;border:1px solid #dde4f0;border-radius:12px;padding:16px;margin-bottom:16px">' +
      '<div class="card-name">' + y.name + '</div>' +
      '<div style="font-size:12px;color:rgba(26,58,107,0.45);margin-top:4px">Submitted by director: <strong>' + (dir?dir.name:'?') + '</strong></div>' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">' +
      '<a href="https://wa.me/' + y.whatsapp + '" target="_blank" style="display:flex;align-items:center;gap:12px;background:#e8f5e9;border:1.5px solid #2e7d32;border-radius:12px;padding:14px 16px;text-decoration:none">' +
        '<span style="font-size:26px">💬</span>' +
        '<div style="flex:1"><div style="font-family:\'Noto Serif SC\',serif;font-weight:700;color:#2e7d32;font-size:14px">Open WhatsApp</div>' +
        '<div style="font-size:11px;color:rgba(26,58,107,0.45)">+' + y.whatsapp + ' · add to clan WhatsApp group</div></div>' +
        '<span style="color:#2e7d32;font-size:18px">↗</span>' +
      '</a>' +
      '<a href="https://instagram.com/' + y.instagram + '" target="_blank" style="display:flex;align-items:center;gap:12px;background:#fce4ec;border:1.5px solid #c0292b;border-radius:12px;padding:14px 16px;text-decoration:none">' +
        '<span style="font-size:26px">📸</span>' +
        '<div style="flex:1"><div style="font-family:\'Noto Serif SC\',serif;font-weight:700;color:#c0292b;font-size:14px">Open Instagram</div>' +
        '<div style="font-size:11px;color:rgba(26,58,107,0.45)">@' + y.instagram + ' · follow & add to clan IG group</div></div>' +
        '<span style="color:#c0292b;font-size:18px">↗</span>' +
      '</a>' +
    '</div>' +
    '<div class="info-box">✓ Confirm youth has joined <strong>both</strong> WhatsApp and Instagram before approving.</div>' +
    '<div class="modal-btns">' +
      '<button class="btn-outline btn-red-outline" onclick="rejectYouth(\'' + youthId + '\')">✕ Reject</button>' +
      '<button class="btn-primary btn-green" onclick="approveYouth(\'' + youthId + '\')">✓ Approve · +1 pt</button>' +
    '</div>';
  document.getElementById('youthReviewContent').innerHTML = html;
  openModal('youthReviewModal');
}

function approveYouth(id) {
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) { alert('Error: ' + res.error); return; }
      var y = STATE.youth.find(function(u){ return String(u.id)===String(id); });
      if (y) { y.status = 'approved'; y.joinedDate = today(); }
      closeModal('youthReviewModal');
      renderAdmin();
    })
    .withFailureHandler(function(e){ hideLoading(); alert('Error: '+e.message); })
    .approveYouth(id);
}

function rejectYouth(id) {
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) { alert('Error: ' + res.error); return; }
      var y = STATE.youth.find(function(u){ return String(u.id)===String(id); });
      if (y) y.status = 'rejected';
      closeModal('youthReviewModal');
      renderAdmin();
    })
    .withFailureHandler(function(e){ hideLoading(); alert('Error: '+e.message); })
    .rejectYouth(id);
}

// ── Event Review Modal ───────────────────────────────────────
function openEventReview(eventId) {
  var ev  = STATE.events.find(function(e){ return String(e.id)===String(eventId); });
  var dir = STATE.users.find(function(u){ return String(u.id)===String(ev.directorId); });
  var wks = weeksUntil(ev.date);
  var html = '<div class="modal-title">Review Event Submission</div>' +
    '<div class="modal-sub">Verify all details before awarding +10 pts.</div>' +
    '<div class="detail-grid">' +
      detailCell('Event Name', ev.name, true) +
      detailCell('Type', badge(ev.type, typeColor(ev.type))) +
      detailCell('Date', fmtDate(ev.date)) +
      detailCell('Weeks Away', '<span style="color:'+(wks<12?'#c0292b':'#2e7d32')+';font-weight:700">' + wks + ' weeks ' + (wks<12?'⚠ too soon':'✓') + '</span>') +
      detailCell('Est. Pax', ev.estPax + ' pax') +
      detailCell('Venue', ev.venue||'—') +
      detailCell('Youth Organiser', ev.youthOrganiser||'—') +
      detailCell('Director / Mentor', dir?dir.name:'—') +
      detailCell('Submitted By', ev.submittedByRole||'—') +
      detailCell('Submitted On', fmtDate(ev.submittedDate)) +
    '</div>' +
    (ev.description ? '<div class="detail-grid"><div class="detail-cell full"><div class="detail-label">Description</div><div style="font-size:13px;color:#1a3a6b;line-height:1.5">' + ev.description + '</div></div></div>' : '') +
    (wks < 12 ? '<div class="warn-box" style="margin-bottom:14px">⚠ Event is less than 12 weeks away. Policy requires 3-month advance notice.</div>' : '') +
    (ev.estPax < 15 ? '<div class="warn-box" style="background:#ffebee;border-color:#c0292b;color:#c0292b;margin-bottom:14px">⚠ Est. attendance below required 15 pax minimum.</div>' : '') +
    '<div class="modal-btns">' +
      '<button class="btn-outline btn-red-outline" onclick="rejectEvent(\'' + eventId + '\')">✕ Reject</button>' +
      '<button class="btn-primary btn-green" onclick="approveEvent(\'' + eventId + '\')">✓ Approve · +10 pts</button>' +
    '</div>';
  document.getElementById('eventReviewContent').innerHTML = html;
  openModal('eventReviewModal');
}

// ── QR Scanner ───────────────────────────────────────────────
function openQR(eventId) {
  var ev = STATE.events.find(function(e){ return String(e.id)===String(eventId); });
  var attendees = Array.isArray(ev.attendees) ? ev.attendees : [];
  var eligible  = STATE.youth.filter(function(y){
    return y.status==='approved' && !attendees.includes(String(y.id));
  });

  var checkedHtml = '';
  if (attendees.length > 0) {
    checkedHtml = '<div style="margin-top:14px">' +
      '<div style="font-size:11px;color:#2e7d32;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px">✓ Checked in (' + attendees.length + ')</div>' +
      '<div class="chips">' +
      attendees.map(function(aid) {
        var u = STATE.youth.find(function(y){ return String(y.id)===String(aid); });
        return u ? '<span class="chip" style="background:#2e7d3214;border-color:#2e7d3230;color:#2e7d32">' + u.name + '</span>' : '';
      }).join('') + '</div></div>';
  }

  var listHtml = eligible.length === 0
    ? '<div class="empty" style="padding:16px 0">All eligible youth already checked in</div>'
    : eligible.map(function(u) {
        return '<button class="qr-scan-item" onclick="confirmScan(\'' + eventId + '\',\'' + u.id + '\',\'' + u.name + '\')">' +
          '<span style="font-size:18px">🪪</span>' +
          '<div><div style="font-family:\'Noto Serif SC\',serif;font-weight:700;color:#1a3a6b;font-size:13px">' + u.name + '</div>' +
          '<div style="font-size:11px;color:rgba(26,58,107,0.45)">' + (u.zh||'') + '</div></div>' +
        '</button>';
      }).join('');

  var html = '<div class="modal-title">📷 Attendance · ' + ev.name + '</div>' +
    '<div class="modal-sub">' + fmtDate(ev.date) + ' · ' + attendees.length + ' checked in</div>' +
    '<div class="qr-viewport">' +
      '<div class="qr-grid"></div>' +
      '<div class="qr-corner" style="top:24px;left:24px;border-right:none;border-bottom:none"></div>' +
      '<div class="qr-corner" style="top:24px;right:24px;border-left:none;border-bottom:none"></div>' +
      '<div class="qr-corner" style="bottom:24px;left:24px;border-right:none;border-top:none"></div>' +
      '<div class="qr-corner" style="bottom:24px;right:24px;border-left:none;border-top:none"></div>' +
      '<div style="text-align:center"><div style="font-size:36px;margin-bottom:8px">📷</div>' +
      '<div style="color:rgba(255,255,255,0.5);font-size:12px">Tap member below to simulate scan</div></div>' +
    '</div>' +
    '<div style="font-size:11px;color:rgba(26,58,107,0.45);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:10px">Select member to check in</div>' +
    '<div class="qr-scan-list">' + listHtml + '</div>' +
    checkedHtml +
    '<div class="modal-btns" style="margin-top:16px"><button class="btn-outline" onclick="closeModal(\'qrModal\')">Close</button></div>';

  document.getElementById('qrContent').innerHTML = html;
  openModal('qrModal');
}

function confirmScan(eventId, youthId, youthName) {
  if (!confirm('Check in ' + youthName + '?')) return;
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) { alert('Error: ' + res.error); return; }
      // Update local state
      var ev = STATE.events.find(function(e){ return String(e.id)===String(eventId); });
      if (ev) {
        if (!Array.isArray(ev.attendees)) ev.attendees = [];
        if (!ev.attendees.includes(String(youthId))) ev.attendees.push(String(youthId));
      }
      var y = STATE.youth.find(function(u){ return String(u.id)===String(youthId); });
      if (y) y.lastActive = today();
      closeModal('qrModal');
      renderAdmin();
    })
    .withFailureHandler(function(e){ hideLoading(); alert('Error: '+e.message); })
    .logAttendance(eventId, youthId);
}

// ══════════════════════════════════════════════════════════════
// SHARED FORM SUBMISSIONS
// ══════════════════════════════════════════════════════════════
function submitYouth() {
  var name = document.getElementById('youthNameInput').value.trim();
  var ig   = document.getElementById('youthIgInput').value.trim();
  var wa   = document.getElementById('youthWaInput').value.trim();
  if (!name || !ig || !wa) { document.getElementById('youthModalErr').textContent = 'All fields required.'; return; }

  var data = {
    name: name, instagram: ig, whatsapp: wa,
    directorId: STATE.currentUser.role === 'director' ? STATE.currentUser.id : STATE.users.find(function(u){return u.role==='director';})?.id
  };

  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) { document.getElementById('youthModalErr').textContent = res.error; return; }
      STATE.youth.push({ id: res.id, directorId: data.directorId, name: data.name, instagram: data.instagram, whatsapp: data.whatsapp, status: 'pending', submittedDate: today(), lastActive: '', joinedDate: '' });
      document.getElementById('youthNameInput').value = '';
      document.getElementById('youthIgInput').value   = '';
      document.getElementById('youthWaInput').value   = '';
      closeModal('addYouthModal');
      if (STATE.currentUser.role === 'admin')    renderAdmin();
      if (STATE.currentUser.role === 'director') renderDirector();
    })
    .withFailureHandler(function(e){ hideLoading(); alert('Error: '+e.message); })
    .submitYouth(data);
}

document.addEventListener('DOMContentLoaded', function() {
  var dateInput = document.getElementById('evDateInput');
  if (dateInput) {
    dateInput.addEventListener('change', function() {
      var wks = Math.floor(daysBetween(today(), this.value) / 7);
      var warn = document.getElementById('evLeadWarn');
      if (warn) warn.style.display = wks < 12 ? 'block' : 'none';
    });
  }
  document.getElementById('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginUser').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('loginPass').focus(); });
});

function submitEvent() {
  var name  = document.getElementById('evNameInput').value.trim();
  var type  = document.getElementById('evTypeInput').value;
  var date  = document.getElementById('evDateInput').value;
  var pax   = document.getElementById('evPaxInput').value;
  var venue = document.getElementById('evVenueInput').value.trim();
  var org   = document.getElementById('evOrgInput').value.trim();
  var desc  = document.getElementById('evDescInput').value.trim();

  if (!name || !date || !pax) { document.getElementById('evModalErr').textContent = 'Name, date and pax required.'; return; }
  var wks = Math.floor(daysBetween(today(), date) / 7);
  if (STATE.currentUser.role === 'youth' && wks < 12) { document.getElementById('evModalErr').textContent = 'Event must be at least 12 weeks away.'; return; }

  var data = {
    name: name, type: type, date: date, estPax: Number(pax),
    venue: venue, description: desc, youthOrganiser: org,
    directorId: STATE.currentUser.role === 'director' ? STATE.currentUser.id : STATE.currentUser.directorId,
    submittedById: STATE.currentUser.id,
    submittedByRole: STATE.currentUser.role,
  };

  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) { document.getElementById('evModalErr').textContent = res.error; return; }
      STATE.events.push(Object.assign({ id: res.id, status: 'pending', submittedDate: today(), attendees: [] }, data));
      ['evNameInput','evDateInput','evPaxInput','evVenueInput','evOrgInput','evDescInput'].forEach(function(id){ document.getElementById(id).value = ''; });
      closeModal('addEventModal');
      if (STATE.currentUser.role === 'admin')    renderAdmin();
      if (STATE.currentUser.role === 'director') renderDirector();
      if (STATE.currentUser.role === 'youth')    renderYouth();
    })
    .withFailureHandler(function(e){ hideLoading(); alert('Error: '+e.message); })
    .submitEvent(data);
}

// ── Small render helpers ─────────────────────────────────────
function sectionHead(title, count, color) {
  return '<div class="section-head">' +
    '<div class="section-bar" style="background:'+color+'"></div>' +
    '<div class="section-title">'+title+'</div>' +
    (count !== null && count !== undefined ? '<div class="section-count" style="background:'+color+'">'+count+'</div>' : '') +
    '</div>';
}
function eventCell(label, val) {
  return '<div class="event-cell"><div class="event-cell-label">'+label+'</div><div class="event-cell-val">'+val+'</div></div>';
}
function detailCell(label, val, full) {
  return '<div class="detail-cell'+(full?' full':'')+'"><div class="detail-label">'+label+'</div><div class="detail-val">'+val+'</div></div>';
}
