<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>济阳蔡氏公会 · Youth Programme</title>
<?!= include('Styles'); ?>
</head>
<body>
<div id="app">
  <!-- LOGIN -->
  <div id="loginScreen" class="screen active">
    <div class="login-wrap">
      <div class="crest">❤️</div>
      <div class="login-title">新加坡济阳蔡氏公会</div>
      <div class="login-sub">YOUTH PROGRAMME</div>
      <div class="login-card">
        <div class="role-tabs" id="roleTabs">
          <button class="role-btn active" onclick="setRole('admin',this)">Admin</button>
          <button class="role-btn" onclick="setRole('director',this)">Director</button>
          <button class="role-btn" onclick="setRole('youth',this)">Youth</button>
        </div>
        <div class="field">
          <label>Name <span style="opacity:.5">(or leave blank)</span></label>
          <input id="loginName" type="text" placeholder="Your name" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
        </div>
        <div class="field">
          <label>Password</label>
          <input id="loginPass" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div id="loginError" class="error-msg" style="display:none"></div>
        <button class="primary-btn" onclick="doLogin()" id="loginBtn">Sign In</button>
        <div class="demo-hint">
          <div class="demo-hint-title">Demo passwords</div>
          <div>Admin: <strong>admin123</strong></div>
          <div>Director: <strong>dir1pass</strong> – <strong>dir4pass</strong></div>
          <div>Youth: <strong>y1pass</strong> – <strong>y3pass</strong></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" class="screen" style="display:none">
    <!-- Header -->
    <div class="header" id="appHeader">
      <div class="header-inner">
        <div class="header-crest">❤️</div>
        <div class="header-text">
          <div class="header-title">新加坡济阳蔡氏公会</div>
          <div class="header-sub" id="headerSub">Youth Programme</div>
        </div>
        <div id="pendingBadge" class="pending-badge" style="display:none">0 pending</div>
        <div id="headerScore" style="display:none" class="header-score">
          <div class="header-score-num" id="headerScoreNum">0</div>
          <div class="header-score-lbl">pts</div>
        </div>
        <button class="signout-btn" onclick="doLogout()">Out</button>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar" id="tabBar"></div>

    <!-- Global stat pills -->
    <div class="stat-strip" id="statStrip">
      <div class="stat-pill">
        <div class="stat-icon">👥</div>
        <div class="stat-val" id="statYouth">0</div>
        <div class="stat-lbl">Active Youth</div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon">📅</div>
        <div class="stat-val" id="statEvents">0</div>
        <div class="stat-lbl">Events Done</div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon">⏳</div>
        <div class="stat-val" id="statPending">0</div>
        <div class="stat-lbl">Pending</div>
      </div>
    </div>

    <!-- Content panels -->
    <div id="contentArea" class="content-area"></div>

    <!-- FAB bar -->
    <div class="fab-bar" id="fabBar" style="display:none">
      <button class="fab-btn navy" id="fabYouth" onclick="openModal('addYouth')">+ Add Youth</button>
      <button class="fab-btn red"  id="fabEvent" onclick="openModal('submitEvent')">+ Submit Event</button>
    </div>
  </div>

  <!-- MODALS -->
  <div id="modalOverlay" class="modal-overlay" style="display:none" onclick="closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()" id="modalSheet"></div>
  </div>
</div>

<?!= include('Script'); ?>
</body>
</html>
