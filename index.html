<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<title>济阳蔡氏公会 · Youth Programme</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1a3a6b;--red:#c0292b;--green:#2e7d32;--gold:#b8960c;--gold2:#c9a84c;
  --cream:#fdf8f0;--bg:#f0f4fb;--white:#fff;--border:#dde4f0;
  --muted:rgba(26,58,107,0.45);--text:#1a3a6b;
  --serif:'Noto Serif SC',serif;--body:Georgia,serif;
}
html,body{height:100%;background:var(--bg);font-family:var(--body);font-size:15px;color:var(--text)}
#app{min-height:100vh}

/* LOGIN */
.login-wrap{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,#2a5298 50%,#1a3a6b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login-logo{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;padding:8px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.2)}
.login-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.login-title{font-family:var(--serif);font-weight:900;color:#fff;font-size:22px;letter-spacing:1px;text-align:center}
.login-sub{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:2px;text-transform:uppercase;margin-top:4px;margin-bottom:24px;text-align:center}
.login-card{background:var(--white);border-radius:20px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.role-tabs{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:20px}
.role-btn{flex:1;padding:9px 0;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:var(--serif);font-weight:700;font-size:13px;cursor:pointer;transition:all 0.2s}
.role-btn.active{background:var(--navy);color:#fff}
.field{margin-bottom:13px}
.field label{font-size:11px;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.field input,.field select,.field textarea{display:block;width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-family:var(--body);font-size:14px;color:var(--text);background:var(--cream);outline:none}
.field textarea{resize:vertical}
.error-msg{font-size:12px;color:var(--red);margin-bottom:10px;padding:8px 12px;background:#fff0f0;border-radius:8px;border:1px solid #ffd0d0}
.primary-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--navy);color:#fff;font-family:var(--serif);font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;transition:opacity 0.2s}
.primary-btn:active{opacity:0.85}
.demo-hint{margin-top:14px;background:var(--cream);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.9}
.demo-hint-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:4px}

/* LANG TOGGLE */
.lang-toggle{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.25);margin-bottom:18px;width:fit-content;margin-left:auto;margin-right:auto}
.lang-btn{padding:5px 14px;border:none;background:transparent;color:rgba(255,255,255,0.6);font-size:12px;cursor:pointer;font-family:var(--body);transition:all 0.2s}
.lang-btn.active{background:rgba(255,255,255,0.2);color:#fff;font-weight:700}

/* HEADER */
.header{background:var(--navy);padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(26,58,107,0.35)}
.header-inner{max-width:640px;margin:0 auto;padding:10px 0;display:flex;align-items:center;gap:10px}
.header-logo{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:3px}
.header-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.header-title{font-family:var(--serif);font-weight:900;color:#fff;font-size:13px}
.header-sub{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:1px;text-transform:uppercase}
.header-text{flex:1}
.pending-badge{background:var(--red);color:#fff;border-radius:20px;padding:4px 10px;font-size:11px;font-family:var(--serif);font-weight:700;animation:pulse 2s infinite;flex-shrink:0}
.header-score{text-align:right;margin-right:4px;flex-shrink:0}
.header-score-num{font-family:var(--serif);font-weight:900;font-size:22px;color:#fff;line-height:1}
.header-score-lbl{font-size:9px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px}
.signout-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;flex-shrink:0}
.header-lang{background:rgba(255,255,255,0.12);border:none;color:rgba(255,255,255,0.8);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;flex-shrink:0}

/* TABS */
.tab-bar{background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:55px;z-index:99;overflow-x:auto;display:flex;white-space:nowrap}
.tab-btn{padding:11px 13px;border:none;background:transparent;color:var(--muted);font-family:var(--serif);font-weight:400;font-size:12px;cursor:pointer;border-bottom:2.5px solid transparent;transition:all 0.2s;white-space:nowrap}
.tab-btn.active{color:var(--navy);font-weight:700;border-bottom:2.5px solid var(--navy)}

/* STAT STRIP */
#statStrip{padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border)}
.stat-strip-inner{display:flex;gap:10px;max-width:640px;margin:0 auto}
.stat-pill{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:11px 12px;flex:1;min-width:0}
.stat-icon{font-size:18px;line-height:1;margin-bottom:3px}
.stat-val{font-family:var(--serif);font-weight:900;font-size:20px;line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);letter-spacing:0.6px;text-transform:uppercase;margin-top:2px}

/* CONTENT */
.content-area{max-width:640px;margin:0 auto;padding:18px 16px 110px;width:100%}

/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:15px 17px;margin-bottom:12px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.section-bar{width:4px;height:20px;border-radius:2px;flex-shrink:0}
.section-title{font-family:var(--serif);font-weight:700;font-size:15px;flex:1}
.section-count{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff}

/* DIR CARD */
.dir-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:17px 19px;margin-bottom:12px}
.dir-header{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:700;flex-shrink:0}
.dir-name{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15px}
.dir-zh{font-family:var(--serif);color:var(--muted);font-size:12px}
.dir-pts{text-align:right}
.dir-pts-num{font-family:var(--serif);font-weight:900;font-size:28px;line-height:1}
.dir-pts-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.score-bar-row{margin-bottom:8px}
.score-bar-top{display:flex;justify-content:space-between;margin-bottom:4px}
.score-bar-label{font-size:11px;color:var(--muted)}
.score-bar-detail{font-size:11px;font-weight:700}
.score-bar-bg{height:5px;background:#eef1f8;border-radius:3px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:3px;transition:width 0.7s ease}
.youth-chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:20px;padding:3px 9px;font-size:10px;border:1px solid transparent}

/* SCORING KEY */
.scoring-key{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:15px}
.key-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:9px}
.key-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.key-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.key-text{font-size:12px}

/* APPROVAL ROWS */
.approval-row{background:var(--white);border:1px solid var(--border);border-radius:0 12px 12px 0;padding:12px 15px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.approval-row.navy{border-left:4px solid var(--navy)}
.approval-row.red{border-left:4px solid var(--red)}
.approval-name{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:14px}
.approval-meta{font-size:11px;color:var(--muted);margin-top:2px}
.review-btn{border:none;color:#fff;border-radius:8px;padding:7px 13px;font-family:var(--serif);font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0}

/* EVENT CARD */
.event-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:15px 17px;margin-bottom:12px}
.event-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.event-cell{background:var(--cream);border-radius:8px;padding:7px 9px}
.event-cell-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.event-cell-val{font-size:12px;font-family:var(--serif);font-weight:600}

/* MEMBER ROW */
.member-row{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin-bottom:10px;display:flex;align-items:center;gap:11px}
.tier-badge-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:13px;border:2px solid;flex-shrink:0}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;white-space:nowrap}

/* STATUS CARD (Youth) */
.status-card{background:linear-gradient(135deg,var(--navy),#2a5298);border-radius:16px;padding:18px;margin-bottom:15px;color:#fff}
.qr-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:15px;text-align:center}
.qr-box{width:120px;height:120px;margin:0 auto 12px;background:var(--cream);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--border)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,40,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:300}
.modal-sheet{background:var(--white);border-radius:20px 20px 0 0;padding:22px 18px 40px;width:100%;max-width:600px;max-height:93vh;overflow-y:auto}
.modal-title{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--navy);margin-bottom:3px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.modal-link{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 15px;text-decoration:none;margin-bottom:10px;border:1.5px solid}
.modal-info{background:#fff8e1;border:1px solid #b8960c44;border-radius:9px;padding:9px 13px;margin-bottom:16px;font-size:12px;color:#7a6200;line-height:1.5}
.modal-warn{background:#ffebee;border:1px solid var(--red);border-radius:9px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--red);line-height:1.5}
.modal-success{background:#e8f5e9;border:1px solid #2e7d32;border-radius:9px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#2e7d32;line-height:1.5}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.modal-cell{background:var(--cream);border-radius:9px;padding:8px 11px}
.modal-cell-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.modal-cell-val{font-size:13px;font-family:var(--serif);font-weight:600;color:var(--navy)}
.modal-btn-row{display:flex;gap:10px;margin-top:4px}
.modal-btn{flex:1;padding:12px 0;border-radius:12px;font-family:var(--serif);font-weight:700;font-size:13px;cursor:pointer;border:none;transition:opacity 0.2s}
.modal-btn.outline{background:transparent;border:1.5px solid}
.modal-btn:disabled{background:#ccc;cursor:not-allowed}
.two-col{display:flex;gap:10px}
.two-col > div{flex:1}

/* ACTIVITIES CHECKBOXES */
.activities-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.activity-chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--cream);font-size:12px;cursor:pointer;transition:all 0.15s;user-select:none;font-family:var(--body)}
.activity-chip.selected{background:var(--navy);border-color:var(--navy);color:#fff}

/* QR SCANNER */
.qr-viewport{background:#111;border-radius:16px;overflow:hidden;margin-bottom:15px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.qr-grid{position:absolute;inset:0;opacity:0.1;background-image:repeating-linear-gradient(0deg,transparent,transparent 20px,rgba(255,255,255,0.15) 20px,rgba(255,255,255,0.15) 21px),repeating-linear-gradient(90deg,transparent,transparent 20px,rgba(255,255,255,0.15) 20px,rgba(255,255,255,0.15) 21px)}
.qr-corner{position:absolute;width:32px;height:32px;border:3px solid #4ade80}
.qr-tl{top:22px;left:22px;border-right:none;border-bottom:none}
.qr-tr{top:22px;right:22px;border-left:none;border-bottom:none}
.qr-bl{bottom:22px;left:22px;border-right:none;border-top:none}
.qr-br{bottom:22px;right:22px;border-left:none;border-top:none}
.qr-sim-list{display:flex;flex-direction:column;gap:7px;max-height:180px;overflow-y:auto;margin-bottom:12px}
.qr-sim-btn{background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;width:100%}

/* FAB BAR */
.fab-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(240,244,251,0.98) 70%,transparent);padding:12px 16px 26px}
.fab-bar > div{max-width:640px;margin:0 auto;display:flex;gap:10px}
.fab-btn{flex:1;padding:13px 0;border-radius:14px;border:none;color:#fff;font-family:var(--serif);font-weight:700;font-size:13px;cursor:pointer;transition:opacity 0.2s}
.fab-btn.navy{background:var(--navy);box-shadow:0 4px 16px rgba(26,58,107,0.4)}
.fab-btn.red{background:var(--red);box-shadow:0 4px 16px rgba(192,41,43,0.4)}

/* HISTORY */
.history-row{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px;opacity:0.75}

/* SCORE BIG */
.score-big{text-align:center;margin-bottom:18px}
.score-big-num{font-family:var(--serif);font-weight:900;font-size:52px;line-height:1}
.score-big-lbl{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:4px}

/* STATS CHART */
.bar-chart-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-chart-label{font-size:12px;width:130px;flex-shrink:0;color:var(--text)}
.bar-chart-track{flex:1;height:18px;background:#eef1f8;border-radius:9px;overflow:hidden}
.bar-chart-fill{height:100%;border-radius:9px;background:var(--navy);transition:width 0.8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.bar-chart-count{font-size:10px;color:#fff;font-weight:700}

/* UTIL */
.empty{text-align:center;padding:36px 0;color:var(--muted);font-size:13px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.75}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}
</style>
</head>

const tierColor = t => t===1?'#2e7d32':t===2?'#b8960c':'#aaa';
const fmtDate = d => { if(!d) return '—'; try{return new Date(d).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;} };
const fmtDateTime = d => { if(!d) return '—'; try{return new Date(d).toLocaleString('en-SG',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return d;} };
const TYPE_COLORS = {Cultural:'#1a3a6b',Social:'#2e7d32',Education:'#7b1fa2',Sports:'#e65100','Community Service':'#b8960c',Other:'#555'};
const el = id => document.getElementById(id);

function logoHTML(size=36) {
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1)"><img src="${LOGO}" style="width:100%;height:100%;object-fit:contain"></div>`;
}

function calcScore(dirId) {
  const myY = STATE.users.filter(u=>u.role==='youth'&&u.directorId===dirId&&u.status==='approved');
  const engPts = myY.reduce((s,y)=>s+tierPts(getTier(y.lastActive)),0);
  const evCount = STATE.events.filter(e=>e.directorId===dirId&&e.status==='approved').length;
  return { onboarded:myY.length, onboardedPts:myY.length, engPts, evCount, evPts:evCount*10,
    total: myY.length + engPts + evCount*10 };
}

// ── API ───────────────────────────────────────────────────
function call(action, payload, cb) {
  const params = new URLSearchParams({action, payload: JSON.stringify(payload||{})});
  fetch(API+'?'+params.toString())
    .then(r=>r.json())
    .then(data=>cb(data))
    .catch(err=>{ console.error(err); alert('Network error: '+err.message); });
}

// ── Lang toggle ───────────────────────────────────────────
function toggleLang() {
  LANG = LANG==='en'?'zh':'en';
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===LANG);
  });
  if(STATE.currentUser) renderApp();
  else renderLogin();
}

function renderLogin() {
  el('loginTitle').textContent = t('appTitle');
  el('loginSub').textContent = t('appSub');
  document.querySelectorAll('.role-btn').forEach((b,i)=>{
    b.textContent = [t('admin'),t('director'),t('youth')][i];
  });
  el('loginNameLbl').textContent = t('nameLbl') + ' ' + t('nameHint');
  el('loginPassLbl').textContent = t('passLbl');
  el('loginBtn').textContent = t('signIn');
}

// ── Login ─────────────────────────────────────────────────
function setRole(role, btn) {
  STATE.loginRole = role;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  el('loginError').style.display='none';
}

function doLogin() {
  const name = el('loginName').value.trim();
  const pass = el('loginPass').value.trim();
  if(!pass) return;
  const btn = el('loginBtn');
  btn.textContent = t('signingIn');
  btn.disabled = true;
  el('loginError').style.display='none';

  call('login', {username:name, password:pass}, res => {
    btn.textContent = t('signIn');
    btn.disabled = false;
    if(!res.success) {
      el('loginError').textContent = t('invalidCreds');
      el('loginError').style.display='block';
      return;
    }
    if(res.user.role !== STATE.loginRole) {
      el('loginError').textContent = t('roleMismatch');
      el('loginError').style.display='block';
      return;
    }
    STATE.currentUser = res.user;
    STATE.role = res.user.role;
    loadAllData();
  });
}

function doLogout() {
  STATE = {currentUser:null,role:null,users:[],events:[],pendingYouth:[],attendance:[],loginRole:'admin'};
  el('loginScreen').style.display='';
  el('mainApp').style.display='none';
  el('loginPass').value='';
  el('loginError').style.display='none';
}

function loadAllData() {
  call('getUsers',{},r1=>{
    if(r1.success) STATE.users=r1.data;
    call('getEvents',{},r2=>{
      if(r2.success) STATE.events=r2.data;
      call('getPendingYouth',{},r3=>{
        if(r3.success) STATE.pendingYouth=r3.data;
        el('loginScreen').style.display='none';
        el('mainApp').style.display='';
        renderApp();
      });
    });
  });
}

// ── Render shell ──────────────────────────────────────────
function renderApp() {
  const u = STATE.currentUser;
  const pendingY = STATE.pendingYouth.filter(y=>y.status==='pending');
  const pendingE = STATE.events.filter(e=>e.status==='pending');
  const totalPending = pendingY.length+pendingE.length;

  // Header
  el('hdrLogoWrap').innerHTML = logoHTML(32);
  el('hdrTitle').textContent = t('appTitle');
  el('hdrSub').textContent = u.role.charAt(0).toUpperCase()+u.role.slice(1)+' · '+u.name;
  el('hdrLang').textContent = LANG==='en'?'中文':'EN';

  if(STATE.role==='admin' && totalPending>0) {
    el('pendingBadge').textContent=totalPending+' '+t('pending');
    el('pendingBadge').style.display='';
  } else { el('pendingBadge').style.display='none'; }

  if(STATE.role==='director') {
    el('headerScore').style.display='';
    el('headerScoreNum').textContent=calcScore(u.id).total;
  } else { el('headerScore').style.display='none'; }

  // Stats
  const approvedYouth = STATE.users.filter(u=>u.role==='youth'&&u.status==='approved').length;
  const approvedEvents = STATE.events.filter(e=>e.status==='approved').length;
  el('statYouth').textContent=approvedYouth;
  el('statEvents').textContent=approvedEvents;
  el('statPending').textContent=totalPending;
  el('statYouthLbl').textContent=t('activeYouth');
  el('statEventsLbl').textContent=t('eventsDone');
  el('statPendingLbl').textContent=t('pending');

  if(STATE.role==='admin') renderAdminTabs();
  else if(STATE.role==='director') renderDirectorTabs();
  else renderYouthTabs();

  renderFAB();
}

function renderFAB() {
  const fb = el('fabBar');
  fb.style.display='';
  if(STATE.role==='youth') {
    fb.innerHTML=`<div><button class="fab-btn red" style="width:100%" onclick="openModal('submitEvent')">${t('proposeEvent')}</button></div>`;
  } else {
    fb.innerHTML=`<div><button class="fab-btn navy" onclick="openModal('addYouth')">${t('addYouth')}</button><button class="fab-btn red" onclick="openModal('submitEvent')">${t('submitEvent')}</button></div>`;
  }
}

function renderTabs(tabs, defaultTab, panelFn) {
  let active = defaultTab;
  const tb = el('tabBar');
  const draw = () => {
    tb.innerHTML = tabs.map(t2=>
      `<button class="tab-btn${t2.id===active?' active':''}" onclick="switchTab('${t2.id}')">${t2.label}</button>`
    ).join('');
    panelFn(active);
  };
  window.switchTab = id=>{ active=id; draw(); };
  draw();
}

// ── ADMIN TABS ────────────────────────────────────────────
function renderAdminTabs() {
  const pendingCount = STATE.pendingYouth.filter(y=>y.status==='pending').length + STATE.events.filter(e=>e.status==='pending').length;
  renderTabs([

}

// ── LEADERBOARD ───────────────────────────────────────────
function scoreBarHTML(label,pts,max,color,detail) {
  const pct=max>0?Math.min(100,(pts/max)*100):0;
  return `<div class="score-bar-row">
    <div class="score-bar-top"><span class="score-bar-label">${label}</span><span class="score-bar-detail" style="color:${color}">${detail}</span></div>
    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

function renderLeaderboard(ca) {
  const dirs = STATE.users.filter(u=>u.role==='director');
  const sorted = [...dirs].sort((a,b)=>calcScore(b.id).total-calcScore(a.id).total);
  const medals=['🥇','🥈','🥉'];
  let html=`<div class="scoring-key">
    <div class="key-title">${t('scoringFormula')}</div>
    ${[
      {dot:'#1a3a6b',tx:t('onboardKey')},
      {dot:'#2e7d32',tx:t('t1Key')},
      {dot:'#b8960c',tx:t('t2Key')},
      {dot:'#aaa',tx:t('t3Key')},
      {dot:'#c0292b',tx:t('eventKey')},
    ].map(k=>`<div class="key-row"><div class="key-dot" style="background:${k.dot}"></div><span class="key-text">${k.tx}</span></div>`).join('')}
  </div>`;

  sorted.forEach((dir,idx)=>{
    const s=calcScore(dir.id);
    const myY=STATE.users.filter(u=>u.role==='youth'&&u.directorId===dir.id&&u.status==='approved');
    const pend=STATE.pendingYouth.filter(y=>y.directorId===dir.id&&y.status==='pending').length;
    html+=`<div class="dir-card fade-in" style="${idx===0?`border-left:4px solid ${dir.color||'#1a3a6b'};box-shadow:0 4px 20px ${dir.color||'#1a3a6b'}22`:''}">
      <div class="dir-header">
        <span style="font-size:20px;width:26px;text-align:center">${medals[idx]||`<span style="font-size:13px;opacity:.5">${idx+1}</span>`}</span>
        <div class="avatar" style="width:42px;height:42px;background:linear-gradient(135deg,${dir.color||'#1a3a6b'},${dir.color||'#1a3a6b'}bb);box-shadow:0 2px 8px ${dir.color||'#1a3a6b'}44;font-size:13px">${dir.avatar||'??'}</div>
        <div style="flex:1"><div class="dir-name">${dir.name}</div><div class="dir-zh">${dir.zh||''}</div></div>
        <div class="dir-pts"><div class="dir-pts-num" style="color:${dir.color||'#1a3a6b'}">${s.total}</div><div class="dir-pts-lbl">pts</div></div>
      </div>
      ${scoreBarHTML('Onboarding',s.onboardedPts,15,'#1a3a6b',`${s.onboarded} youth × 1 = ${s.onboardedPts} pts`)}
      ${scoreBarHTML('Engagement',s.engPts,30,'#2e7d32',`${s.engPts} pts/month`)}
      ${scoreBarHTML('Youth Events',s.evPts,50,'#c0292b',`${s.evCount} × 10 = ${s.evPts} pts`)}
      <div class="youth-chips">
        ${myY.map(y=>{const tt=getTier(y.lastActive);return`<div class="chip" style="background:${tierColor(tt)}14;border-color:${tierColor(tt)}30;color:${tierColor(tt)}">${y.name} T${tt}</div>`;}).join('')}
        ${pend>0?`<div class="chip" style="background:#fff8e1;border-color:#b8960c;color:#7a6200">+${pend} pending</div>`:''}
      </div>
    </div>`;
  });
  ca.innerHTML=html;
}

// ── APPROVALS ─────────────────────────────────────────────
function renderApprovals(ca) {
  const pendingY=STATE.pendingYouth.filter(y=>y.status==='pending');
  const pendingE=STATE.events.filter(e=>e.status==='pending');
  const doneY=STATE.pendingYouth.filter(y=>y.status!=='pending');
  const doneE=STATE.events.filter(e=>e.status!=='pending');

  // Count approved events this month for cap check
  const thisMonth=new Date().toISOString().slice(0,7);
  const approvedThisMonth=STATE.events.filter(e=>e.status==='approved'&&(e.approvedDate||'').startsWith(thisMonth)).length;

  let html=`<div class="section-head"><div class="section-bar" style="background:var(--navy)"></div><div class="section-title">${t('youthOnboarding')}</div><div class="section-count" style="background:var(--navy)">${pendingY.length}</div></div>`;
  if(!pendingY.length) html+=`<div class="empty">${t('noPending')} ✓</div>`;
  else pendingY.forEach(y=>{
    const dir=STATE.users.find(d=>d.id===y.directorId);
    const dob = y.dob ? `· DOB: ${y.dob}` : '';
    const email = y.email ? `· ${y.email}` : '';
    html+=`<div class="approval-row navy">
      <div style="flex:1"><div class="approval-name">${y.name}</div>
      <div class="approval-meta">@${y.instagram} · +${y.whatsapp} ${dob} ${email}<br>via <strong>${dir?.name||'?'}</strong> · Submitted ${fmtDate(y.submittedDate)}</div></div>
      <button class="review-btn" style="background:var(--navy)" onclick="openReviewYouth('${y.id}')">${t('reviewArrow')}</button>
    </div>`;
  });

  html+=`<div class="section-head" style="margin-top:22px"><div class="section-bar" style="background:var(--red)"></div><div class="section-title">${t('eventApprovals')}</div><div class="section-count" style="background:var(--red)">${pendingE.length}</div></div>`;
  if(approvedThisMonth>=4) html+=`<div class="modal-warn">⚠ ${approvedThisMonth}/4 events already approved this month. No more approvals until next month.</div>`;
  if(!pendingE.length) html+=`<div class="empty">${t('noPending')} ✓</div>`;
  else pendingE.forEach(ev=>{
    const dir=STATE.users.find(d=>d.id===ev.directorId);
    const weeks=ev.date?Math.floor(daysBetween(today(),ev.date)/7):0;
    const tc=TYPE_COLORS[ev.type]||'#555';
    html+=`<div class="approval-row red">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px">
          <div class="approval-name">${ev.name}</div>
          <span class="badge" style="background:${tc}18;color:${tc}">${ev.type}</span>
          ${weeks<12?`<span class="badge" style="background:var(--red)18;color:var(--red)">⚠ &lt;12wks</span>`:''}
        </div>
        <div class="approval-meta">📅 ${fmtDate(ev.date)} ${ev.time?'· ⏰ '+ev.time:''} · 👥 ~${ev.estPax} · 💰 $${ev.budget||0} · 📍 ${ev.venue||'TBC'} · 🎓 ${dir?.name||'?'}</div>
      </div>
      <button class="review-btn" style="background:var(--red)" onclick="openReviewEvent('${ev.id}')">${t('reviewArrow')}</button>
    </div>`;
  });

  if(doneY.length||doneE.length) {
    html+=`<div class="section-head" style="margin-top:22px"><div class="section-bar" style="background:#aaa"></div><div class="section-title">${t('decisionHistory')}</div></div>`;
    [...doneY.map(y=>{return{name:y.name,status:y.status,detail:`@${y.instagram}`}}),
     ...doneE.map(e=>{return{name:e.name,status:e.status,detail:`${e.type} · ${fmtDate(e.date)}`}})]
    .forEach(item=>{
      const sc=item.status==='approved'?'#2e7d32':'#c0292b';
      html+=`<div class="history-row"><div style="flex:1"><div style="font-weight:700;font-size:13px">${item.name}</div><div style="font-size:11px;color:var(--muted)">${item.detail}</div></div><span class="badge" style="background:${sc}18;color:${sc}">${item.status==='approved'?'✓ Approved':'✕ Rejected'}</span></div>`;
    });
  }
  ca.innerHTML=html;
}

  const b=Number(el('mEvBudget').value);
  el('mEvBudgetWarn').style.display=b>500?'block':'none';
}

function submitEventForm() {
  const name=el('mEvName').value.trim(), date=el('mEvDate').value, pax=el('mEvPax').value;
  const budget=Number(el('mEvBudget').value||0);
  if(!name||!date||!pax) return alert('Fill required fields: name, date, pax.');

  if(u.role==='youth') {

    if(weeks<12) return alert('Event must be at least 12 weeks away.');

  call('submitEvent',{
    name, type:el('mEvType').value, date, time:el('mEvTime').value,
    estPax:Number(pax), budget, venue:el('mEvVenue').value.trim(),
    description:el('mEvDesc').value.trim(),

    witnessDirector:el('mEvWitness').value,
    directorId:el('mEvDir').value,
    submittedById:u.id, submittedByRole:u.role
  },res=>{
    if(res.success){closeModal();loadAllData();}else alert(res.message);
  });
}

  ${atCap?`<div class="modal-warn">⚠ 4 events already approved this month. Cannot approve more.</div>`:''}
  <div class="modal-btn-row">
    <button class="modal-btn outline" style="border-color:var(--red);color:var(--red)" onclick="rejectEventAction('${ev.id}')">${t('rejectEvent')}</button>
    <button class="modal-btn" style="background:${atCap?'#ccc':'#2e7d32'};color:#fff" ${atCap?'disabled':''} onclick="approveEventAction('${ev.id}')">${t('approveEvent')}</button>
  </div>`;
}

function approveEventAction(id) {
  call('approveEvent',{id},res=>{
    if(res.success){closeModal();loadAllData();}else alert(res.message);
  });
}
function rejectEventAction(id) {
  call('rejectEvent',{id},res=>{
    if(res.success){closeModal();loadAllData();}else alert(res.message);
  });
}

// ── QR SCANNER ────────────────────────────────────────────
function buildQRScannerModal(ev) {
  if(!ev) return '<div class="modal-title">Event not found</div>';
  const eligible=STATE.users.filter(u=>u.role==='youth'&&u.status==='approved'&&!(ev.attendees||[]).includes(u.id));
  const checked=(ev.attendees||[]).map(aid=>STATE.users.find(u=>u.id===aid)).filter(Boolean);
  return `<div class="modal-title">📷 Attendance · ${ev.name}</div>
  <div class="modal-sub">${fmtDate(ev.date)} ${ev.time||''} · ${(ev.attendees||[]).length} checked in</div>
  <div class="qr-viewport">
    <div class="qr-grid"></div>
    <div class="qr-corner qr-tl"></div><div class="qr-corner qr-tr"></div>
    <div class="qr-corner qr-bl"></div><div class="qr-corner qr-br"></div>
    <div style="text-align:center;z-index:1"><div style="font-size:34px;margin-bottom:8px">📷</div>
    <div style="color:rgba(255,255,255,.5);font-size:12px">Point camera at member QR<br><span style="opacity:.4">(demo: use buttons below)</span></div></div>
  </div>
  <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Simulate scan</div>
  <div class="qr-sim-list">
    ${eligible.length===0?`<div style="text-align:center;color:var(--muted);font-size:13px;padding:14px">All eligible youth checked in ✓</div>`:
    eligible.map(u=>`<button class="qr-sim-btn" onclick="scanAttendance('${ev.id}','${u.id}')">
      <span style="font-size:18px">🪪</span>
      <div><div style="font-family:var(--serif);font-weight:700;color:var(--navy);font-size:13px">${u.name}</div>
      <div style="font-size:11px;color:var(--muted)">${u.zh||''}</div></div>
    </button>`).join('')}
  </div>
  ${checked.length>0?`<div style="font-size:11px;color:#2e7d32;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">✓ Checked in (${checked.length})</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${checked.map(u=>`<div class="chip" style="background:#2e7d3214;border-color:#2e7d3230;color:#2e7d32">${u.name}</div>`).join('')}</div>`:''}`;
}

function scanAttendance(eventId,userId) {
  call('logAttendance',{eventId,userId},res=>{
    if(res.success) {
      const ev=STATE.events.find(e=>e.id===eventId);
      if(ev&&!(ev.attendees||[]).includes(userId)) {ev.attendees=ev.attendees||[];ev.attendees.push(userId);}
      const u=STATE.users.find(x=>x.id===userId);
      if(u) u.lastActive=today();
      el('modalSheet').innerHTML=buildQRScannerModal(STATE.events.find(e=>e.id===eventId));
      renderApp();
    }else alert(res.message);
  });
}
</script>
</body>
