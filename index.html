<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<title>济阳蔡氏公会 · Youth Programme</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1a3a6b;--red:#c0292b;--green:#2e7d32;--gold:#b8960c;
  --cream:#fdf8f0;--bg:#f0f4fb;--white:#fff;--border:#dde4f0;
  --muted:rgba(26,58,107,0.45);--text:#1a3a6b;
  --serif:'Noto Serif SC',serif;--body:'Georgia',serif;
}
html,body{height:100%;background:var(--bg);font-family:var(--body);font-size:15px;color:var(--text)}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ── SCREENS ── */
.screen{flex:1}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,#2a5298 50%,#1a3a6b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.crest{font-size:52px;margin-bottom:12px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3))}
.login-title{font-family:var(--serif);font-weight:900;color:#fff;font-size:22px;letter-spacing:1px;text-align:center}
.login-sub{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:2px;text-transform:uppercase;margin-top:4px;margin-bottom:24px}
.login-card{background:var(--white);border-radius:20px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.role-tabs{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:20px}
.role-btn{flex:1;padding:9px 0;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:var(--serif);font-weight:700;font-size:13px;cursor:pointer;transition:all 0.2s}
.role-btn.active{background:var(--navy);color:#fff}
.field{margin-bottom:14px}
.field label{font-size:11px;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.field input,.field select,.field textarea{display:block;width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-family:var(--body);font-size:14px;color:var(--text);background:var(--cream);outline:none}
.field textarea{resize:vertical}
.error-msg{font-size:12px;color:var(--red);margin-bottom:10px}
.primary-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--navy);color:#fff;font-family:var(--serif);font-weight:700;font-size:14px;cursor:pointer;margin-top:4px}
.demo-hint{margin-top:16px;background:var(--cream);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.8}
.demo-hint-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:4px}

/* ── HEADER ── */
.header{background:var(--navy);padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(26,58,107,0.35)}
.header-inner{max-width:640px;margin:0 auto;padding:12px 0;display:flex;align-items:center;gap:10px}
.header-crest{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.header-title{font-family:var(--serif);font-weight:900;color:#fff;font-size:13px}
.header-sub{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:1px;text-transform:uppercase}
.header-text{flex:1}
.pending-badge{background:var(--red);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-family:var(--serif);font-weight:700;animation:pulse 2s infinite}
.header-score{text-align:right;margin-right:4px}
.header-score-num{font-family:var(--serif);font-weight:900;font-size:24px;color:#fff;line-height:1}
.header-score-lbl{font-size:9px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px}
.signout-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer}

/* ── TAB BAR ── */
.tab-bar{background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:64px;z-index:99;overflow-x:auto;display:flex;white-space:nowrap}
.tab-btn{padding:12px 14px;border:none;background:transparent;color:var(--muted);font-family:var(--serif);font-weight:400;font-size:12px;cursor:pointer;border-bottom:2.5px solid transparent;transition:all 0.2s;white-space:nowrap}
.tab-btn.active{color:var(--navy);font-weight:700;border-bottom:2.5px solid var(--navy)}

/* ── STAT STRIP ── */
.stat-strip{background:var(--white);border-bottom:1px solid var(--border);padding:12px 16px}
.stat-strip > div.inner{max-width:640px;margin:0 auto;display:flex;gap:10px}
.stat-strip{display:flex;justify-content:center}
.stat-strip-inner{display:flex;gap:10px;width:100%;max-width:640px}
.stat-pill{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px 14px;flex:1;min-width:0}
.stat-icon{font-size:20px;line-height:1;margin-bottom:4px}
.stat-val{font-family:var(--serif);font-weight:900;font-size:22px;line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;margin-top:3px}

/* ── CONTENT ── */
.content-area{max-width:640px;margin:0 auto;padding:20px 16px 110px;width:100%}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card.highlight{box-shadow:0 4px 20px rgba(26,58,107,0.12)}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-bar{width:4px;height:20px;border-radius:2px;flex-shrink:0}
.section-title{font-family:var(--serif);font-weight:700;font-size:15px;flex:1}
.section-count{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff}

/* ── DIRECTOR CARD ── */
.dir-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:12px}
.dir-header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:700;flex-shrink:0}
.dir-name{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15px}
.dir-zh{font-family:var(--serif);color:var(--muted);font-size:12px}
.dir-pts{text-align:right}
.dir-pts-num{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1}
.dir-pts-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.score-bar-row{margin-bottom:8px}
.score-bar-top{display:flex;justify-content:space-between;margin-bottom:4px}
.score-bar-label{font-size:11px;color:var(--muted)}
.score-bar-detail{font-size:11px;font-weight:700}
.score-bar-bg{height:5px;background:#eef1f8;border-radius:3px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:3px;transition:width 0.7s ease}
.youth-chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:20px;padding:3px 10px;font-size:10px;border:1px solid transparent}

/* ── SCORING KEY ── */
.scoring-key{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.key-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:10px}
.key-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.key-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.key-text{font-size:12px}

/* ── APPROVAL ROWS ── */
.approval-row{background:var(--white);border:1px solid var(--border);border-radius:0 12px 12px 0;padding:13px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.approval-row.navy{border-left:4px solid var(--navy)}
.approval-row.red{border-left:4px solid var(--red)}
.approval-name{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:14px}
.approval-meta{font-size:11px;color:var(--muted);margin-top:2px}
.review-btn{border:none;color:#fff;border-radius:8px;padding:8px 14px;font-family:var(--serif);font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0}

/* ── EVENT CARD ── */
.event-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.event-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.event-cell{background:var(--cream);border-radius:8px;padding:8px 10px}
.event-cell-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px}
.event-cell-val{font-size:12px;font-family:var(--serif);font-weight:600}

/* ── MEMBER ROW ── */
.member-row{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.tier-badge-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:13px;border:2px solid;flex-shrink:0}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap}

/* ── YOUTH MEMBER CARD ── */
.status-card{background:linear-gradient(135deg,var(--navy),#2a5298);border-radius:16px;padding:20px;margin-bottom:16px;color:#fff}
.qr-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;text-align:center}
.qr-box{width:120px;height:120px;margin:0 auto 12px;background:var(--cream);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--border)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,40,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:300}
.modal-sheet{background:var(--white);border-radius:20px 20px 0 0;padding:24px 20px 44px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto}
.modal-title{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--navy);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.modal-link{display:flex;align-items:center;gap:12px;border-radius:12px;padding:13px 16px;text-decoration:none;margin-bottom:10px;border:1.5px solid}
.modal-link-icon{font-size:24px}
.modal-link-title{font-family:var(--serif);font-weight:700;font-size:14px}
.modal-link-sub{font-size:11px;color:var(--muted)}
.modal-link-arrow{margin-left:auto;font-size:16px}
.modal-info{background:#fff8e1;border:1px solid #b8960c44;border-radius:9px;padding:10px 14px;margin-bottom:20px;font-size:12px;color:#7a6200}
.modal-warn{background:#ffebee;border:1px solid var(--red);border-radius:9px;padding:9px 12px;margin-bottom:14px;font-size:12px;color:var(--red)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.modal-cell{background:var(--cream);border-radius:9px;padding:9px 12px}
.modal-cell-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px}
.modal-cell-val{font-size:13px;font-family:var(--serif);font-weight:600;color:var(--navy)}
.modal-btn-row{display:flex;gap:10px}
.modal-btn{flex:1;padding:13px 0;border-radius:12px;font-family:var(--serif);font-weight:700;font-size:13px;cursor:pointer;border:none}
.modal-btn.outline{background:transparent;border:1.5px solid}
.modal-btn:disabled{background:#ccc;cursor:not-allowed}
.two-col{display:flex;gap:10px}
.two-col > div{flex:1}

/* ── QR SCANNER ── */
.qr-viewport{background:#111;border-radius:16px;overflow:hidden;margin-bottom:16px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.qr-grid{position:absolute;inset:0;opacity:0.1;background-image:repeating-linear-gradient(0deg,transparent,transparent 20px,rgba(255,255,255,0.15) 20px,rgba(255,255,255,0.15) 21px),repeating-linear-gradient(90deg,transparent,transparent 20px,rgba(255,255,255,0.15) 20px,rgba(255,255,255,0.15) 21px)}
.qr-corner{position:absolute;width:32px;height:32px;border:3px solid #4ade80}
.qr-tl{top:24px;left:24px;border-right:none;border-bottom:none}
.qr-tr{top:24px;right:24px;border-left:none;border-bottom:none}
.qr-bl{bottom:24px;left:24px;border-right:none;border-top:none}
.qr-br{bottom:24px;right:24px;border-left:none;border-top:none}
.qr-sim-list{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;margin-bottom:14px}
.qr-sim-btn{background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;width:100%}
.checked-in-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ── FAB BAR ── */
.fab-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(240,244,251,0.98) 70%,transparent);padding:14px 16px 28px}
.fab-bar > div{max-width:640px;margin:0 auto;display:flex;gap:10px}
.fab-btn{flex:1;padding:14px 0;border-radius:14px;border:none;color:#fff;font-family:var(--serif);font-weight:700;font-size:13px;cursor:pointer}
.fab-btn.navy{background:var(--navy);box-shadow:0 4px 16px rgba(26,58,107,0.4)}
.fab-btn.red{background:var(--red);box-shadow:0 4px 16px rgba(192,41,43,0.4)}
.fab-btn.full{width:100%}

/* ── HISTORY ROWS ── */
.history-row{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;opacity:0.75}

/* ── SCORE BIG ── */
.score-big{text-align:center;margin-bottom:20px}
.score-big-num{font-family:var(--serif);font-weight:900;font-size:56px;line-height:1}
.score-big-lbl{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:4px}

/* ── UTIL ── */
.empty{text-align:center;padding:40px 0;color:var(--muted);font-size:13px}
.full-btn{width:100%;padding:13px;border-radius:12px;border:none;color:#fff;font-family:var(--serif);font-weight:700;font-size:14px;cursor:pointer;margin-top:4px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.75}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}

/* Stat strip inner wrapper fix */
#statStrip{padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border)}
#statStrip .stat-strip-inner{display:flex;gap:10px;max-width:640px;margin:0 auto}


.login-logo{width:80px;height:80px;margin:0 auto 14px;display:block;object-fit:contain;filter:drop-shadow(0 2px 12px rgba(184,150,12,0.7));flex-shrink:0}
.header-logo{width:30px;height:30px;object-fit:contain;flex-shrink:0}
.lang-btn{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:var(--serif);font-weight:700}
.login-lang-btn{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:var(--serif);font-weight:700}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:200px;overflow-y:auto;padding:2px 0}
.act-label{display:flex;align-items:center;gap:7px;font-size:11px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--cream);line-height:1.3;user-select:none}
.act-label input{width:13px;height:13px;flex-shrink:0;accent-color:var(--navy)}
.act-label:has(input:checked){background:var(--navy);color:#fff;border-color:var(--navy)}
.notice-box{background:#fffbeb;border:1.5px solid #b8960c;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.notice-box-title{font-family:var(--serif);font-weight:700;color:#7a6200;font-size:12px;margin-bottom:5px}
.notice-box-body{font-size:11px;color:#7a6200;line-height:1.7}
.activity-chart{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.chart-bar-label{font-size:11px;color:var(--navy);width:125px;flex-shrink:0;line-height:1.3}
.chart-bar-outer{flex:1;background:#eef1f8;border-radius:3px;height:14px;overflow:hidden}
.chart-bar-inner{height:100%;border-radius:3px;transition:width 0.8s ease}
.chart-bar-count{font-size:11px;font-weight:700;color:var(--navy);width:22px;text-align:right;flex-shrink:0}
.login-wrap{position:relative;display:flex;flex-direction:column;align-items:center;min-height:100vh;background:linear-gradient(160deg,#1a3a6b 0%,#2a5298 50%,#1a3a6b 100%);padding:32px 20px 40px}

</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="loginScreen">

function t(key) { return T[LANG][key] || T['en'][key] || key; }
function toggleLang() {
  LANG = LANG === 'en' ? 'cn' : 'en';
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中文' : 'EN';
  // Re-render login labels
  const lname = document.querySelector('label[for-lang="name"]');
  const lpass = document.querySelector('label[for-lang="pass"]');
  if (lname) lname.textContent = t('nameLabel');
  if (lpass) lpass.textContent = t('passLabel');
  document.getElementById('loginName').placeholder = t('namePlaceholder');
  document.getElementById('loginSub').textContent = t('sub');
  if (STATE.currentUser) renderApp();
}
// ── State ─────────────────────────────────────────────────

const daysBetween = (d1, d2) => Math.floor((new Date(d2) - new Date(d1)) / 86400000);
const getTier = la => { if (!la) return 3; const d = daysBetween(la, today()); return d <= 30 ? 1 : d <= 60 ? 2 : 3; };

const tierLabel = t => t === 1 ? 'Tier 1 · Active' : t === 2 ? 'Tier 2 · Fading' : 'Tier 3 · Inactive';
const tierColor = t => t === 1 ? '#2e7d32' : t === 2 ? '#b8960c' : '#aaa';
const fmtDate   = d => { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'}); } catch(e){ return d; }};
const TYPE_COLORS = {Cultural:'#1a3a6b',Social:'#2e7d32',Education:'#7b1fa2',Sports:'#e65100','Community Service':'#b8960c',Other:'#555'};
const el = id => document.getElementById(id);

function calcScore(dirId) {
  const myYouth = STATE.users.filter(u => u.role === 'youth' && u.directorId === dirId && u.status === 'approved');
  const onboarded = myYouth.length;
  const engPts = myYouth.reduce((s, y) => s + tierPts(getTier(y.lastActive)), 0);
  const evCount = STATE.events.filter(e => e.directorId === dirId && e.status === 'approved').length;
  return { onboarded, onboardedPts: onboarded, engPts, evCount, evPts: evCount * 10, total: onboarded + engPts + evCount * 10 };
}

// ── GAS call ──────────────────────────────────────────────
function call(action, payload, cb) {
  google.script.run
    .withSuccessHandler(cb)
    .withFailureHandler(function(err){ alert('Error: ' + err.message); })
    .dispatch(action, payload || {});
}

// ── Login ─────────────────────────────────────────────────
function setRole(role, btn) {
  STATE.loginRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function doLogin() {
  const name = el('loginName').value.trim();
  const pass = el('loginPass').value.trim();
  if (!pass) { el('loginError').textContent = 'Please enter your password.'; el('loginError').style.display='block'; return; }
  const btn = el('loginBtn');
  btn.textContent = 'Signing in…';
  btn.disabled = true;
  call('login', { username: name, password: pass, role: STATE.loginRole }, res => {
    btn.textContent = 'Sign In';
    btn.disabled = false;
    if (!res.success) { el('loginError').textContent = res.message; el('loginError').style.display = 'block'; return; }
    el('loginError').style.display = 'none';
    if (res.user.role !== STATE.loginRole) {
      el('loginError').textContent = 'Wrong role tab selected. Please select ' + res.user.role + '.';
      el('loginError').style.display = 'block'; return;
    }
    STATE.currentUser = res.user;
    STATE.role = res.user.role;
    loadAllData();
  });
}

function doLogout() {
  STATE = { currentUser: null, role: null, users: [], events: [], pendingYouth: [], attendance: [], loginRole: 'admin' };
  el('loginScreen').style.display = '';
  el('mainApp').style.display = 'none';
  el('loginPass').value = '';
}

// ── Load all data then render ─────────────────────────────
function loadAllData() {
  call('getUsers', {}, r1 => {
    if (r1.success) STATE.users = r1.data;
    call('getEvents', {}, r2 => {
      if (r2.success) STATE.events = r2.data;
      call('getPendingYouth', {}, r3 => {
        if (r3.success) STATE.pendingYouth = r3.data;
        renderApp();
      });
    });
  });
}

// ── Render shell ──────────────────────────────────────────
function renderApp() {
  el('loginScreen').style.display = 'none';
  el('mainApp').style.display = '';

  const u = STATE.currentUser;
  el('headerSub').textContent = u.role.charAt(0).toUpperCase() + u.role.slice(1) + ' · ' + u.name;

  const pendingY = STATE.pendingYouth.filter(y => y.status === 'pending');
  const pendingE = STATE.events.filter(e => e.status === 'pending');
  const totalPending = pendingY.length + pendingE.length;

  // Stats
  const statInner = el('statStrip');
  statInner.innerHTML = `<div class="stat-strip-inner">
    <div class="stat-pill"><div class="stat-icon">👥</div><div class="stat-val" style="color:var(--navy)">${STATE.users.filter(u=>u.role==='youth'&&u.status==='approved').length}</div><div class="stat-lbl">Active Youth</div></div>
    <div class="stat-pill"><div class="stat-icon">📅</div><div class="stat-val" style="color:var(--red)">${STATE.events.filter(e=>e.status==='approved').length}</div><div class="stat-lbl">Events Done</div></div>
    <div class="stat-pill"><div class="stat-icon">⏳</div><div class="stat-val" style="color:var(--gold)">${totalPending}</div><div class="stat-lbl">Pending</div></div>
  </div>`;

  if (STATE.role === 'admin') {
    if (totalPending > 0) { el('pendingBadge').textContent = totalPending + ' pending'; el('pendingBadge').style.display = ''; }
    renderAdminTabs();
  } else if (STATE.role === 'director') {
    el('headerScore').style.display = '';
    const s = calcScore(u.id);
    el('headerScoreNum').textContent = s.total;
    renderDirectorTabs();
  } else {
    renderYouthTabs();
  }

  el('fabBar').style.display = '';
  renderFAB();
}

// ── FAB ───────────────────────────────────────────────────
function renderFAB() {
  const fb = el('fabBar');
  if (STATE.role === 'youth') {
    fb.innerHTML = '<div><button class="fab-btn red full" onclick="openModal(\'submitEvent\')">+ Propose an Event</button></div>';
  } else {
    fb.innerHTML = '<div><button class="fab-btn navy" onclick="openModal(\'addYouth\')">+ Add Youth</button><button class="fab-btn red" onclick="openModal(\'submitEvent\')">+ Submit Event</button></div>';

}

// ── ADMIN TABS ────────────────────────────────────────────
function renderAdminTabs() {
  const pendingCount = STATE.pendingYouth.filter(y=>y.status==='pending').length + STATE.events.filter(e=>e.status==='pending').length;
  const tabs = [
    { id: 'leaderboard', label: 'Leaderboard' },
    { id: 'approvals',   label: 'Approvals' + (pendingCount > 0 ? ' ('+pendingCount+')' : '') },
    { id: 'events',      label: 'Events' },
    { id: 'members',     label: 'Members' },
  ];
  renderTabs(tabs, 'leaderboard', renderAdminPanel);
}

function renderAdminPanel(tab) {
  const ca = el('contentArea');
  if (tab === 'leaderboard') renderLeaderboard(ca);
  else if (tab === 'approvals') renderApprovals(ca);
  else if (tab === 'events') renderEvents(ca, true);
  else if (tab === 'members') renderMembers(ca);
}

// ── DIRECTOR TABS ─────────────────────────────────────────
function renderDirectorTabs() {
  const tabs = [{ id: 'my-youth', label: 'My Youth' }, { id: 'my-events', label: 'My Events' }, { id: 'score', label: 'My Score' }];
  renderTabs(tabs, 'my-youth', renderDirectorPanel);
}

function renderDirectorPanel(tab) {
  const ca = el('contentArea');

  else if (tab === 'my-events') renderMyEvents(ca);

// ── YOUTH TABS ────────────────────────────────────────────
function renderYouthTabs() {
  const tabs = [{ id: 'home', label: 'Home' }, { id: 'events', label: 'Events' }, { id: 'my-submissions', label: 'My Submissions' }];
  renderTabs(tabs, 'home', renderYouthPanel);
}

function renderYouthPanel(tab) {
  const ca = el('contentArea');
  if (tab === 'home') renderYouthHome(ca);
  else if (tab === 'events') renderYouthEvents(ca);
  else if (tab === 'my-submissions') renderYouthSubmissions(ca);
}

// ── Tab renderer ──────────────────────────────────────────
function renderTabs(tabs, defaultTab, panelFn) {
  let activeTab = defaultTab;
  const tb = el('tabBar');
  const render = () => {
    tb.innerHTML = tabs.map(t =>
      `<button class="tab-btn${t.id===activeTab?' active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
    ).join('');
    panelFn(activeTab);
  };
  window.switchTab = id => { activeTab = id; render(); };
  render();
}

// ── LEADERBOARD ───────────────────────────────────────────
function renderLeaderboard(ca) {
  const directors = STATE.users.filter(u => u.role === 'director');
  const sorted = [...directors].sort((a,b) => calcScore(b.id).total - calcScore(a.id).total);
  const medals = ['🥇','🥈','🥉'];

  let html = `<div class="scoring-key">
    <div class="key-title">Scoring Formula</div>
    ${[
      {dot:'#1a3a6b', text:'Onboarding: +1 pt per approved youth'},
      {dot:'#2e7d32', text:'Engagement Tier 1 (≤30d): +3 pts/month'},
      {dot:'#b8960c', text:'Engagement Tier 2 (31–60d): +2 pts/month'},
      {dot:'#aaa',    text:'Engagement Tier 3 (>60d): +0 pts/month'},
      {dot:'#c0292b', text:'Youth-led event approved: +10 pts each'},
    ].map(k=>`<div class="key-row"><div class="key-dot" style="background:${k.dot}"></div><span class="key-text">${k.text}</span></div>`).join('')}
  </div>`;

  sorted.forEach((dir, idx) => {
    const s = calcScore(dir.id);
    const myYouth = STATE.users.filter(u => u.role==='youth' && u.directorId===dir.id && u.status==='approved');
    const pending = STATE.pendingYouth.filter(y => y.directorId===dir.id && y.status==='pending').length;
    const borderLeft = idx === 0 ? `border-left:4px solid ${dir.color||'#1a3a6b'}` : '';

    html += `<div class="dir-card fade-in" style="${borderLeft}${idx===0?';box-shadow:0 4px 20px rgba(26,58,107,0.12)':''}">
      <div class="dir-header">
        <span style="font-size:22px;width:28px;text-align:center">${medals[idx]||'<span style="font-size:14px;opacity:0.5">'+(idx+1)+'</span>'}</span>
        <div class="avatar" style="width:44px;height:44px;background:linear-gradient(135deg,${dir.color||'#1a3a6b'},${dir.color||'#1a3a6b'}bb);box-shadow:0 2px 8px ${dir.color||'#1a3a6b'}44;font-size:14px">${dir.avatar||'??'}</div>
        <div style="flex:1"><div class="dir-name">${dir.name}</div><div class="dir-zh">${dir.zh||''}</div></div>
        <div class="dir-pts"><div class="dir-pts-num" style="color:${dir.color||'#1a3a6b'}">${s.total}</div><div class="dir-pts-lbl">pts</div></div>
      </div>
      ${scoreBarHTML('Onboarding', s.onboardedPts, 15, '#1a3a6b', `${s.onboarded} youth × 1 pt = ${s.onboardedPts} pts`)}
      ${scoreBarHTML('Engagement', s.engPts, 30, '#2e7d32', `${s.engPts} pts/month`)}
      ${scoreBarHTML('Youth Events', s.evPts, 50, '#c0292b', `${s.evCount} event${s.evCount!==1?'s':''} × 10 = ${s.evPts} pts`)}
      <div class="youth-chips">
        ${myYouth.map(y=>{const t=getTier(y.lastActive);return`<div class="chip" style="background:${tierColor(t)}14;border-color:${tierColor(t)}30;color:${tierColor(t)}">${y.name} · T${t}</div>`;}).join('')}
        ${pending>0?`<div class="chip" style="background:#fff8e1;border-color:#b8960c;color:#7a6200">+${pending} pending</div>`:''}
      </div>
    </div>`;
  });
  ca.innerHTML = html;
}

function scoreBarHTML(label, pts, max, color, detail) {
  const pct = max > 0 ? Math.min(100, (pts/max)*100) : 0;
  return `<div class="score-bar-row">
    <div class="score-bar-top"><span class="score-bar-label">${label}</span><span class="score-bar-detail" style="color:${color}">${detail}</span></div>
    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

// ── APPROVALS ─────────────────────────────────────────────
function renderApprovals(ca) {
  const pendingY = STATE.pendingYouth.filter(y => y.status === 'pending');
  const pendingE = STATE.events.filter(e => e.status === 'pending');
  const doneY    = STATE.pendingYouth.filter(y => y.status !== 'pending');
  const doneE    = STATE.events.filter(e => e.status !== 'pending');

  let html = `<div class="section-head"><div class="section-bar" style="background:var(--navy)"></div><div class="section-title">Youth Onboarding</div><div class="section-count" style="background:var(--navy)">${pendingY.length}</div></div>`;

  if (pendingY.length === 0) html += `<div class="empty">No pending youth ✓</div>`;
  else pendingY.forEach(y => {
    const dir = STATE.users.find(d => d.id === y.directorId);
    html += `<div class="approval-row navy">
      <div style="flex:1"><div class="approval-name">${y.name}</div>
      <div class="approval-meta">@${y.instagram} · +${y.whatsapp} · via <strong>${dir?.name||'?'}</strong></div></div>
      <button class="review-btn" style="background:var(--navy)" onclick="openReviewYouth('${y.id}')">Review →</button>
    </div>`;
  });

  html += `<div class="section-head" style="margin-top:24px"><div class="section-bar" style="background:var(--red)"></div><div class="section-title">Event Approvals</div><div class="section-count" style="background:var(--red)">${pendingE.length}</div></div>`;

  if (pendingE.length === 0) html += `<div class="empty">No pending events ✓</div>`;
  else pendingE.forEach(ev => {
    const dir = STATE.users.find(d => d.id === ev.directorId);
    const weeks = ev.date ? Math.floor(daysBetween(today(), ev.date)/7) : 0;
    const tooSoon = weeks < 12;
    const tc = TYPE_COLORS[ev.type]||'#555';
    html += `<div class="approval-row red">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
          <div class="approval-name">${ev.name}</div>
          <span class="badge" style="background:${tc}18;color:${tc}">${ev.type}</span>
          ${tooSoon?`<span class="badge" style="background:var(--red)18;color:var(--red)">⚠ &lt;12wks</span>`:''}
        </div>
        <div class="approval-meta">📅 ${fmtDate(ev.date)} · 👥 ~${ev.estPax} · 📍 ${ev.venue||'TBC'} · 🎓 ${dir?.name||'?'}</div>
      </div>
      <button class="review-btn" style="background:var(--red)" onclick="openReviewEvent('${ev.id}')">Review →</button>
    </div>`;
  });

  // History
  if (doneY.length > 0 || doneE.length > 0) {
    html += `<div class="section-head" style="margin-top:24px"><div class="section-bar" style="background:#aaa"></div><div class="section-title">Decision History</div></div>`;
    [...doneY.map(y=>({name:y.name,status:y.status,detail:`@${y.instagram}`})),
     ...doneE.map(e=>({name:e.name,status:e.status,detail:`${e.type} · ${fmtDate(e.date)}`}))
    ].forEach(item => {
      const sc = item.status==='approved'?'#2e7d32':'#c0292b';
      html += `<div class="history-row">
        <div style="flex:1"><div style="font-weight:700;font-size:13px">${item.name}</div><div style="font-size:11px;color:var(--muted)">${item.detail}</div></div>
        <span class="badge" style="background:${sc}18;color:${sc}">${item.status==='approved'?'✓ Approved':'✕ Rejected'}</span>
      </div>`;
    });
  }

  ca.innerHTML = html;
}

function scanAttendance(eventId, userId) {
  call('logAttendance', { eventId, userId }, res => {
    if (res.success) {
      // Update local state
      const ev = STATE.events.find(e => e.id === eventId);
      if (ev && !ev.attendees.includes(userId)) ev.attendees.push(userId);
      const u = STATE.users.find(x => x.id === userId);
      if (u) u.lastActive = today();
      // Re-render scanner
      el('modalSheet').innerHTML = buildQRScannerModal(STATE.events.find(e => e.id === eventId));
      // Update stats
      renderApp();
    } else alert(res.message);
  });
}

  '<div class="field"><label>Event Name</label><input id="mEN" placeholder="e.g. Heritage Walk 2026"></div>'+
  '<div class="two-col">'+
    '<div class="field"><label>Type</label><select id="mET">'+types.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Date</label><input id="mED" type="date" onchange="chkD()"></div>'+
  '</div>'+
  '<div id="mEDW" style="display:none" class="modal-warn">⚠ Must be ≥12 weeks away.</div>'+
  '<div class="two-col">'+
    '<div class="field"><label>Start Time</label><input id="mES" type="time" value="10:00"></div>'+
    '<div class="field"><label>End Time</label><input id="mEE" type="time" value="13:00"></div>'+
  '</div>'+
  '<div class="two-col">'+
    '<div class="field"><label>Pax under 50 (min 15)</label><input id="mEPU" type="number" placeholder="15"></div>'+
    '<div class="field"><label>Pax above 50</label><input id="mEPO" type="number" value="0"></div>'+
  '</div>'+
  '<div class="two-col">'+
    '<div class="field"><label>Venue</label><input id="mEV" placeholder="Location"></div>'+
    '<div class="field"><label>Budget $ (max 500)</label><input id="mEB" type="number" placeholder="0" oninput="chkB()"></div>'+
  '</div>'+
  '<div id="mEBW" style="display:none" class="modal-warn">⚠ Budget cannot exceed $500.</div>'+
  '<div class="field"><label>Youth Organiser</label><input id="mEO" placeholder="Youth name"></div>'+
  '<div class="field"><label>Witness Director (must attend)</label><select id="mEW">'+
    dirs.map(function(d){return '<option value="'+d.id+'"'+(d.id===presel?' selected':'')+'>'+d.name+'</option>';}).join('')+
  '</select></div>'+
  '<div class="field"><label>Description</label><textarea id="mEDesc" rows="3" placeholder="Brief description..."></textarea></div>'+
  '<div class="modal-btn-row" style="margin-top:8px">'+
    '<button class="modal-btn outline" style="border-color:var(--navy);color:var(--navy)" onclick="closeModal()">Cancel</button>'+
    '<button class="modal-btn" style="background:var(--red);color:#fff" onclick="doSubmitEvent()">Submit for Approval</button>'+
  '</div>';
}

window.chkD=function(){var d=el('mED').value,w=d?Math.floor((new Date(d)-new Date())/604800000):99,x=el('mEDW');if(x)x.style.display=w<12?'block':'none';};
window.chkB=function(){var b=parseFloat((el('mEB')||{}).value)||0,x=el('mEBW');if(x)x.style.display=b>500?'block':'none';};

function doSubmitEvent() {
  var name=el('mEN').value.trim(), date=el('mED').value;
  var paxU=parseInt(el('mEPU').value)||0, paxO=parseInt(el('mEPO').value)||0;
  var budget=parseFloat(el('mEB').value)||0;
  if(!name||!date) return alert('Fill required fields.');
  if(paxU<15) return alert('Need at least 15 pax under age 50.');
  if(budget>500) return alert('Budget max $500.');
  if(Math.floor((new Date(date)-new Date())/604800000)<12) return alert('Must be 12+ weeks away.');
  var u=STATE.currentUser;
  call('submitEvent',{
    name:name,type:el('mET').value,date:date,
    startTime:el('mES').value,endTime:el('mEE').value,
    estPaxUnder50:paxU,estPaxOver50:paxO,estPax:paxU+paxO,
    budget:budget,venue:el('mEV').value.trim(),
    description:el('mEDesc').value.trim(),
    youthOrganiser:el('mEO').value.trim(),
    directorId:el('mEW').value,witnessDirectorId:el('mEW').value,
    submittedById:u.id,submittedByRole:u.role
  },function(res){if(res.success){closeModal();loadAllData();}else alert(res.message);});
}

// ── Activity stats ────────────────────────────────────────
function renderActivityStats(container) {
  var youth=STATE.users.filter(function(u){return u.role==='youth'&&u.status==='approved';});
  var counts={};
  youth.forEach(function(y){(y.activities||'').split(',').filter(Boolean).forEach(function(a){counts[a]=(counts[a]||0)+1;});});
  var sorted=Object.entries(counts).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  var max=sorted.length?sorted[0][1]:1;
  var colors=['#1a3a6b','#c0292b','#2e7d32','#b8960c','#7b1fa2','#e65100'];
  var html='<div class="section-head" style="margin-top:18px"><div class="section-bar" style="background:var(--navy)"></div><div class="section-title">Top Activities Among Youth</div></div><div class="activity-chart">';
  if(!sorted.length){html+='<div class="empty">No activity data yet.</div>';}
  else sorted.forEach(function(item,i){var pct=(item[1]/max)*100;html+='<div class="chart-bar-row"><div class="chart-bar-label">'+item[0]+'</div><div class="chart-bar-outer"><div class="chart-bar-inner" style="width:'+pct+'%;background:'+colors[i%colors.length]+'"></div></div><div class="chart-bar-count">'+item[1]+'</div></div>';});
  html+='</div>';
  container.innerHTML+=html;
}

</script>
</body>
</html>
